[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nica-geofetch"
version = "0.1.0"
description = "Reproducible access to trusted institutional geodata for Nicaragua."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Gustavo Ernesto Martínez Cárdenas"}]
keywords = ["Nicaragua", "geospatial", "INETER", "Pfafstetter", "KML"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=1.0,<2",
  "lxml>=5,<7",
  "pyogrio>=0.9,<1",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "shapely>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/datanicaragua/nica-geofetch"
Issues = "https://github.com/datanicaragua/nica-geofetch/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<3",
  "nbformat>=5.10,<6",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "responses>=0.25,<1",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]
notebook = [
  "ipywidgets>=8.1,<9",
]

[project.scripts]
nica-geofetch = "nica_geofetch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nica_geofetch"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["nica_geofetch"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = [
  "live: opt-in test that accesses the official INETER endpoint",
]

[tool.coverage.run]
source = ["nica_geofetch"]
branch = true
